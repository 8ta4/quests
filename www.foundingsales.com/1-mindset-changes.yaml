- question: |
    Is adopting a new mindset often counterintuitive for first-time sales professionals?
  answer: |
    One of the biggest things to adjust to when approaching sales for the first time is the often counterintuitive shift required to your mindset. This is especially true for founders with a background in non-sales disciplines like engineering, product management, finance, or even marketing.
  yes: true
- question: |
    Should you embrace a mindset of scarcity?
  answer: |
    Reject a mindset of scarcity—and, hence, hoarding—and embrace a mindset of plenty.
  yes: false
- question: |
    Should you read the entire email communication history with that prospect before you call him?
  answer: |
   Don’t read the entire email communication history with that prospect before you call him.
  yes: false
- question: |
    Should you avoid being direct?
  answer: |
    Society often gets along through polite obfuscation. Through indirection. Through politesse, and circuitousness. Not in sales land, friend. It is imperative to respect their time and yours by being direct and getting to the heart of the matter.
  yes: false
- question: |
    Is assuming the sale is inevitable only helpful after achieving perfect product-market fit?
  answer: |
    Approach your sales conversations with the stance that the prospect will inevitably be a customer. This is more applicable when you’re at the scaling stage, when it is now clear that the solution that you’re presenting has product/market fit. But it can be helpful even at the earlier stages of your go-to-market period.
  yes: false
- question: |
    Do you need to transcribe every single word a prospect says during a call?
  answer: |
    Of course, you don’t need to transcribe each and every thing that a prospect says on the phone.
  yes: false
- question: |
    Is modern sales about trying to sell snake oil?
  answer: |
    Modern sales is not about trying to sell snake oil to a “mark.”
  yes: false
- question: |
    Does expertness in the sales domain make interactions more fearless?
  answer: |
    This expertness will make you fearless in your interactions.
  yes: true
- question: |
    Is fear of failure one of the biggest blocks on action?
  answer: |
    Fear of failure is one of the biggest blocks on action.
  yes: true
- question: |
    Can you escape math in sales?
  answer: |
    You can’t escape math in sales either—especially if you want to have success at any amount of scale greater than a single rep.
  yes: false
- question: |
    Will a mindset of inevitability help you be more consultative in your interactions?
  answer: |
    Or if you expect to win, are unfazed by loss, and have adopted the mindset of expertise, it’s easier to adopt a stance of inevitability. That, in turn, will help you be fearless and authoritative in your interactions, and more consultative, which will lead to higher close rates.
  yes: true
